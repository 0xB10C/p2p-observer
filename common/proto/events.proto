syntax = "proto3";
package p2p_observer;

message PeerEvent {
  uint64 connection_id     = 1;
  uint64 timestamp_ms      = 2;
  string peer_addr         = 3;  // e.g. "1.2.3.4:38333"
  string user_agent        = 4;
  uint32 transport_version = 5;  // 1 or 2

  oneof event {
    PingRtt ping_rtt = 6;
    // future variants: BlockInv, HeaderAnnouncement, etc.
  }
}

message PingRtt {
  uint64 rtt_ms = 1;
}
