[package]
name = "metrics"
version = "0.1.0"
edition = "2024"

[dependencies]
common = { path = "../../common" }
clap = { version = "4.6.7", features = ["derive"] }

tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
# Without the default protobuf feature: the text exposition format is all
# Prometheus needs, and the protobuf one pulls in a second protobuf crate.
prometheus = { version = "0.14", default-features = false }
