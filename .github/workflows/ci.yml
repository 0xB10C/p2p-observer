name: ci

on:
  workflow_dispatch:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-Dwarnings"

jobs:

  # Nix jobs

  nix-build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - uses: ./.github/actions/setup-nix-action
    - name: Build
      run: nix develop --command cargo build --all-features

  nix-test:
    runs-on: ubuntu-latest
    needs: nix-build
    steps:
    - uses: actions/checkout@v6
    - uses: ./.github/actions/setup-nix-action
    - name: Run tests
      run: nix develop --command cargo test --all-features

  nix-format:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - uses: ./.github/actions/setup-nix-action
    # needed to have all packages code-generated for fmt
    - name: Run cargo check
      run: nix develop --command cargo check --all
    - name: Run cargo fmt
      run: nix develop --command cargo fmt --all -- --check

  nix-coverage:
    runs-on: ubuntu-latest
    needs: nix-build
    steps:
    - uses: actions/checkout@v6
    - uses: ./.github/actions/setup-nix-action
    - name: Run coverage
      run: nix develop --command cargo tarpaulin --out Lcov --out Html --workspace --all-features
    - name: Upload HTML coverage report
      uses: actions/upload-artifact@v4
      with:
        name: coverage-html
        path: tarpaulin-report.html
    - name: Upload LCOV file
      uses: actions/upload-artifact@v4
      with:
        name: coverage-lcov
        path: lcov.info

  # Ubuntu jobs

  ubuntu-build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - uses: ./.github/actions/setup-ubuntu-action
    - name: Build
      run: cargo build --all-features

  ubuntu-test:
    runs-on: ubuntu-latest
    needs: ubuntu-build
    steps:
    - uses: actions/checkout@v6
    - uses: ./.github/actions/setup-ubuntu-action
    - name: Install integration test dependecies
      run: sudo apt-get install -y nats-server
    - name: Run tests and integration tests
      run: NATS_SERVER_BINARY=$(which nats-server) cargo test --all-features

  ubuntu-check-and-fmt:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - uses: ./.github/actions/setup-ubuntu-action
    - name: Build
      run: cargo check --all-features
    - name: Run cargo fmt
      run: cargo fmt --all -- --check

  ubuntu-lint:
    runs-on: ubuntu-latest
    needs: ubuntu-build
    steps:
    - uses: actions/checkout@v6
    - uses: ./.github/actions/setup-ubuntu-action
    - name: cargo clippy
      run: cargo clippy --all-targets --all-features
