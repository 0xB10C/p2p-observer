name: ci

on:
  workflow_dispatch:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  # A merge queue tests a pull request grouped with the ones ahead of it,
  # which is a different event from either of the two above: without this
  # line the required checks never run for a queued pull request, it waits
  # for checks that cannot arrive, and the queue stalls. Harmless until a
  # queue exists -- the event does not fire -- so it goes in first.
  merge_group:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-Dwarnings"
  # A panic in a destructor that runs while another panic is already unwinding
  # does not unwind again -- it aborts, and an abort prints no test summary
  # and names no test. A backtrace is the only thing left that says where it
  # was, and is worth having for an ordinary panic too.
  RUST_BACKTRACE: 1

jobs:

  # Nix jobs

  nix-build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - uses: ./.github/actions/setup-nix-action
    - name: Build
      run: nix develop --command cargo build --all-features

  nix-test:
    runs-on: ubuntu-latest
    needs: nix-build
    steps:
    - uses: actions/checkout@v6
    - uses: ./.github/actions/setup-nix-action
    - name: Run tests
      run: nix develop --command cargo test --all-features

  nix-format:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - uses: ./.github/actions/setup-nix-action
    # needed to have all packages code-generated for fmt
    - name: Run cargo check
      run: nix develop --command cargo check --all --all-targets
    - name: Run cargo fmt
      run: nix develop --command cargo fmt --all -- --check

  nix-coverage:
    runs-on: ubuntu-latest
    needs: nix-build
    steps:
    - uses: actions/checkout@v6
    - uses: ./.github/actions/setup-nix-action
    # A floor, not a target, and two points below where the workspace stands:
    # a checkout where nats-server or bitcoind does not start skips the
    # integration tests and loses a point or two of coverage, and that should
    # not read as a regression. The job used to upload a report and nothing
    # else, which meant the number could fall for a year without anyone
    # noticing; failing here puts the fall on the pull request that caused it.
    # Raise it deliberately when a stretch of work lifts the number, and lower
    # it only with a reason in the commit message.
    - name: Run coverage
      run: nix develop --command cargo tarpaulin --engine llvm --out Lcov --out Html --workspace --all-features --fail-under 82
    # Uploaded even when the gate fails, which is when the report is most worth
    # reading: it names the lines that stopped being covered.
    - name: Upload HTML coverage report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: coverage-html
        path: tarpaulin-report.html
    - name: Upload LCOV file
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: coverage-lcov
        path: lcov.info

  nix-package:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - uses: ./.github/actions/setup-nix-action
    # Builds the workspace in the sandbox and runs the test suite in the
    # checkPhase, against the bitcoind and nats-server the package pins. The
    # dev shell jobs above run the same tests; this one also proves the package
    # itself still builds, which is what a NixOS host installs.
    - name: Build the package
      run: nix build .#p2p-observer --print-build-logs

  nix-vm-test:
    runs-on: ubuntu-latest
    needs: nix-package
    steps:
    - uses: actions/checkout@v6
    # The NixOS test boots two VMs, and nix only schedules such a build on a
    # machine whose /dev/kvm it can open. The runner has the device but not the
    # permissions, so widen them before nix starts and detects the feature.
    - name: Allow the runner to use KVM
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm
    - uses: ./.github/actions/setup-nix-action
    # Several minutes: two VMs boot, Bitcoin Core syncs a regtest chain to the
    # observer, and Grafana provisions every dashboard the metrics tool ships.
    - name: Run the NixOS module test
      run: nix build .#checks.x86_64-linux.module --print-build-logs

  # Ubuntu jobs

  ubuntu-build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - uses: ./.github/actions/setup-ubuntu-action
    - name: Build
      run: cargo build --all-features

  ubuntu-test:
    runs-on: ubuntu-latest
    needs: ubuntu-build
    steps:
    - uses: actions/checkout@v6
    - uses: ./.github/actions/setup-ubuntu-action
    - name: Install integration test dependecies
      run: sudo apt-get install -y nats-server
    - name: Run tests and integration tests
      run: NATS_SERVER_BINARY=$(which nats-server) cargo test --all-features

  ubuntu-check-and-fmt:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - uses: ./.github/actions/setup-ubuntu-action
    - name: Build
      run: cargo check --all-features --all-targets
    - name: Run cargo fmt
      run: cargo fmt --all -- --check

  ubuntu-lint:
    runs-on: ubuntu-latest
    needs: ubuntu-build
    steps:
    - uses: actions/checkout@v6
    - uses: ./.github/actions/setup-ubuntu-action
    - name: cargo clippy
      run: cargo clippy --all-targets --all-features
