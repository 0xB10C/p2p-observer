[package]
name = "observer"
version = "0.1.0"
edition = "2024"
# Only the benchmarks named below are targets. Without this the shared
# harness in benches/ is discovered as a benchmark of its own, and its
# helpers then read as dead code.
autobenches = false

[dependencies]
common = { path = "../common" }
bip324 = { git = "https://github.com/rust-bitcoin/bip324", package = "bip324", features = ["tokio"] }
tokio-socks = "0.5"
sha3 = "0.12"
rand = "0.10"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
bitcoind = { package = "corepc-node", git = "https://github.com/rust-bitcoin/corepc", rev = "0b8bea91181c5ab5b6c3f81fea66a51eff15b92b", features = ["30_2", "download"] }
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "net", "io-util", "test-util"] }
testsupport = { path = "../testsupport" }

[features]
# Exposes the internals the benchmarks measure. Off in an ordinary build, so
# nothing is public that does not need to be.
bench = []

# The binary carries the project's name rather than the crate's, so that it
# does not claim a word as plain as "observer" in a PATH.
[[bin]]
name = "p2p-observer"
path = "src/main.rs"

[[bench]]
name = "addressbook"
harness = false
required-features = ["bench"]

[[bench]]
name = "headertree"
harness = false
required-features = ["bench"]
